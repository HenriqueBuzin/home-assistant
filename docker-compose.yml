name: home-assistant-${HA_SITE:?Defina HA_SITE}-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-labels: &default-labels
  infra.project: home-assistant
  infra.environment: development
  infra.site: ${HA_SITE}
  infra.version: ${IMAGE_TAG:-local}

services:
  backend:
    image: home-assistant/backend:${IMAGE_TAG:-local}-dev
    labels: *default-labels
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      HA_URL: ${HA_URL:?Defina HA_URL}
    volumes:
      - type: bind
        source: ${HA_CONFIG_ROOT:?Defina HA_CONFIG_ROOT}
        target: /config
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "8123"
    networks:
      proxy-network:
        aliases:
          - home-assistant-${HA_SITE}-dev
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  proxy-network:
    external: true
